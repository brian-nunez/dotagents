<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — replace with page name</title>
<!-- Optional web font (keep the system fallback in --font-sans):
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
-->
<style>
/* ==========================================================================
   TOKENS — the only place raw values live. Swap palette ramps for the brief's
   palette (assets/palettes/*.json). Default: palette 15 (blue + blue-grey).
   ========================================================================== */
:root {
  /* Spacing & sizing (px/4 naming) */
  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;
  --space-6: 24px;  --space-8: 32px;  --space-12: 48px; --space-16: 64px;
  --space-24: 96px; --space-32: 128px; --space-48: 192px; --space-64: 256px;
  --space-96: 384px; --space-128: 512px; --space-160: 640px; --space-192: 768px;

  /* Type */
  --font-sans: "Inter", -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --text-xs: 0.75rem;  --text-sm: 0.875rem; --text-base: 1rem;   --text-lg: 1.125rem;
  --text-xl: 1.25rem;  --text-2xl: 1.5rem;  --text-3xl: 1.875rem; --text-4xl: 2.25rem;
  --text-5xl: 3rem;    --text-6xl: 3.75rem; --text-7xl: 4.5rem;
  --weight-normal: 400; --weight-medium: 500; --weight-bold: 600; --weight-display: 700;
  --leading-none: 1; --leading-tight: 1.25; --leading-snug: 1.375;
  --leading-normal: 1.5; --leading-relaxed: 1.625; --leading-loose: 2;
  --tracking-tight: -0.02em; --tracking-normal: 0; --tracking-caps: 0.05em;
  --measure: 34em;

  /* Radius — ONE set per project (subtle shown) */
  --radius-sm: 2px; --radius: 4px; --radius-lg: 8px; --radius-button: 4px; --radius-full: 9999px;

  /* Density — comfortable (see tokens.md for compact / airy) */
  --control-h: 40px; --row-h: 48px; --card-pad: 24px; --section-gap: 64px;

  /* Borders */
  --border: 1px; --border-2: 2px; --border-accent: 4px; --border-accent-lg: 6px;

  /* Elevation */
  --shadow-1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
  --shadow-2: 0 3px 6px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.12);
  --shadow-3: 0 10px 20px rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.10);
  --shadow-4: 0 15px 25px rgba(0,0,0,.15), 0 5px 10px rgba(0,0,0,.05);
  --shadow-5: 0 20px 40px rgba(0,0,0,.2);
  --shadow-inset: inset 0 2px 4px rgba(0,0,0,.06);
  --shadow-image-edge: inset 0 0 0 1px rgba(0,0,0,.1);

  /* Palette ramps */
  --primary-050:#DCEEFB; --primary-100:#B6E0FE; --primary-200:#84C5F4; --primary-300:#62B0E8; --primary-400:#4098D7;
  --primary-500:#2680C2; --primary-600:#186FAF; --primary-700:#0F609B; --primary-800:#0A558C; --primary-900:#003E6B;
  --neutral-050:#F0F4F8; --neutral-100:#D9E2EC; --neutral-200:#BCCCDC; --neutral-300:#9FB3C8; --neutral-400:#829AB1;
  --neutral-500:#627D98; --neutral-600:#486581; --neutral-700:#334E68; --neutral-800:#243B53; --neutral-900:#102A43;
  --success-050:#F0FCF9; --success-100:#C6F7E9; --success-200:#8EEDD1; --success-300:#5FE3C0; --success-400:#2DCCA7;
  --success-500:#17B897; --success-600:#079A82; --success-700:#048271; --success-800:#016457; --success-900:#004440;
  --danger-050:#FFEEEE; --danger-100:#FACDCD; --danger-200:#F29B9B; --danger-300:#E66A6A; --danger-400:#D64545;
  --danger-500:#BA2525; --danger-600:#A61B1B; --danger-700:#911111; --danger-800:#780A0A; --danger-900:#610404;
  --warning-050:#FFFAEB; --warning-100:#FCEFC7; --warning-200:#F8E3A3; --warning-300:#F9DA8B; --warning-400:#F7D070;
  --warning-500:#E9B949; --warning-600:#C99A2E; --warning-700:#A27C1A; --warning-800:#7C5E10; --warning-900:#513C06;
  /* info aliases the primary ramp (palette has no separate info hue) */
  --info-050: var(--primary-050);  --info-100: var(--primary-100);  --info-200: var(--primary-200);  --info-300: var(--primary-300);  --info-400: var(--primary-400);
  --info-500: var(--primary-500);  --info-600: var(--primary-600);  --info-700: var(--primary-700);  --info-800: var(--primary-800);  --info-900: var(--primary-900);

  /* Roles */
  --bg-page: var(--neutral-050);
  --bg-surface: #fff;
  --bg-subtle: var(--neutral-100);
  --line: var(--neutral-200);
  --text-primary: var(--neutral-900);
  --text-secondary: var(--neutral-700);
  --text-tertiary: var(--neutral-600);
  --action: var(--primary-600);
  --action-hover: var(--primary-700);
  --focus: var(--primary-500);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font-sans); font-size: var(--text-base);
  line-height: var(--leading-normal); color: var(--text-primary); background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
h1, h2, h3, h4 { line-height: var(--leading-tight); font-weight: var(--weight-bold); }
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.prose { max-width: var(--measure); }
.eyebrow { font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-tertiary); }
.num { font-variant-numeric: tabular-nums; }

/* ==========================================================================
   COMPONENTS (starting points — adapt to the brief's personality)
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-button);
  border: var(--border) solid transparent; font-weight: var(--weight-bold);
  line-height: var(--leading-none); white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color .15s, box-shadow .15s;
}
.btn-primary { background: var(--action); color: #fff; box-shadow: var(--shadow-1); }
.btn { min-height: var(--control-h); }
.btn-primary:hover { background: var(--action-hover); }
.btn-primary:active { box-shadow: none; }
.btn-secondary { background: var(--bg-surface); color: var(--text-primary); border-color: var(--neutral-300); }
.btn-secondary:hover { background: var(--neutral-050); }
.btn-tertiary { background: none; color: var(--primary-700); padding-inline: var(--space-2); }
.btn-tertiary:hover { text-decoration: underline; }
.btn:disabled { background: var(--neutral-100); color: var(--neutral-400); box-shadow: none; cursor: not-allowed; }

.field { display: grid; gap: var(--space-2); }
.field + .field { margin-top: var(--space-6); }
.label { font-size: var(--text-sm); font-weight: var(--weight-bold); color: var(--text-primary); }
.help { font-size: var(--text-sm); color: var(--text-secondary); }
.input {
  height: var(--control-h); padding: 0 var(--space-3); border-radius: var(--radius);
  border: var(--border) solid var(--neutral-300); background: #fff; box-shadow: var(--shadow-inset);
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus-visible { border-color: var(--primary-500); }
.input[aria-invalid="true"] { border-color: var(--danger-500); }
.error { font-size: var(--text-sm); color: var(--danger-700); }

.card { background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); padding: var(--card-pad); }
.badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.badge-success { background: var(--success-100); color: var(--success-900); }
.badge-warning { background: var(--warning-100); color: var(--warning-900); }
.badge-danger  { background: var(--danger-100);  color: var(--danger-900); }

/* Two-tone icons from assets/icons: inline the SVG, then color here */
.icon { width: 24px; height: 24px; flex: none; }
.icon .primary { fill: var(--primary-200); }
.icon .secondary { fill: var(--primary-700); }
.icon-muted .primary { fill: var(--neutral-300); }
.icon-muted .secondary { fill: var(--neutral-600); }

/* SKETCH MODE — grayscale directions. Active on ?sketch or whenever DIRECTIONS is non-empty.
   Remaps every ramp to pure grey so directions are judged on structure, not color. */
html[data-sketch] {
  --neutral-050:#F7F7F7; --neutral-100:#E1E1E1; --neutral-200:#CFCFCF; --neutral-300:#B1B1B1; --neutral-400:#9E9E9E; --neutral-500:#7E7E7E; --neutral-600:#626262; --neutral-700:#515151; --neutral-800:#3B3B3B; --neutral-900:#222222;
  --primary-050:#F7F7F7; --primary-100:#E1E1E1; --primary-200:#CFCFCF; --primary-300:#B1B1B1; --primary-400:#9E9E9E; --primary-500:#7E7E7E; --primary-600:#626262; --primary-700:#515151; --primary-800:#3B3B3B; --primary-900:#222222;
  --action: var(--neutral-800); --action-hover: var(--neutral-900); --focus: var(--neutral-600);
}
html[data-sketch] [class*="badge-"] { background: var(--neutral-100); color: var(--neutral-900); }

/* ==========================================================================
   STATES & DIRECTIONS — ?state=empty  ?direction=b  (add ?clean to hide bar)
   Mark blocks with data-when="default empty" / data-direction="a".
   ========================================================================== */
[data-off] { display: none !important; }
.mockup-bar {
  position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 1000;
  display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3);
  background: #102A43; color: #F0F4F8; border-radius: var(--radius-full); box-shadow: var(--shadow-4);
  font: 500 12px/1 var(--font-sans);
}
.mockup-bar a { color: #BCCCDC; text-decoration: none; padding: 6px 10px; border-radius: 9999px; }
.mockup-bar a[aria-current="true"] { background: #F0F4F8; color: #102A43; }
.mockup-bar .caption { padding-inline: 6px; opacity: .8; max-width: 40ch; }
</style>
</head>
<body>

<!-- ======================================================================
     MOCKUP CONTENT — replace everything inside <main>.
     Example of state-aware blocks:
       <section data-when="default">…real content…</section>
       <section data-when="empty">…designed empty state…</section>
     Example of direction blocks (directions.html):
       <div data-direction="a">…</div>  <div data-direction="b">…</div>
     ====================================================================== -->
<main>
  <section data-when="default" style="padding: var(--space-16) var(--space-6); max-width: var(--space-160); margin: 0 auto;">
    <p class="eyebrow">Starter</p>
    <h1 style="font-size: var(--text-3xl); margin-top: var(--space-2);">Replace with the real page</h1>
    <p class="prose" style="color: var(--text-secondary); margin-top: var(--space-3);">Tokens, base components and the state switcher are ready. Build the design inside &lt;main&gt;.</p>
    <div style="display:flex; gap: var(--space-3); margin-top: var(--space-6);">
      <button class="btn btn-primary">Primary action</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-tertiary">Tertiary</button>
    </div>
  </section>
  <section data-when="empty" style="padding: var(--space-16) var(--space-6); text-align: center;">
    <h2 style="font-size: var(--text-xl);">Empty state</h2>
  </section>
</main>

<!-- Switcher: lists states/directions and rewrites the hide rules. Edit the arrays. -->
<nav class="mockup-bar" aria-label="Mockup controls" hidden></nav>
<script>
(() => {
  const STATES = ["default", "empty"];            // e.g. ["default","empty","loading","error"]
  const DIRECTIONS = [];                           // e.g. [["a","Split: form leads"],["b","Single column: story leads"]]
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || STATES[0];
  const dir = q.get("direction") || (DIRECTIONS[0] && DIRECTIONS[0][0]) || "";
  document.querySelectorAll("[data-when]").forEach(el =>
    el.toggleAttribute("data-off", !el.dataset.when.split(/\s+/).includes(state)));
  document.querySelectorAll("[data-direction]").forEach(el =>
    el.toggleAttribute("data-off", el.dataset.direction !== dir));
  document.body.dataset.state = state;
  if (q.has("sketch") || DIRECTIONS.length) document.documentElement.dataset.sketch = "";
  // Critique filters: ?filter=gray (hierarchy without color), ?filter=blur (squint test)
  const f = { gray: "grayscale(1)", blur: "blur(6px)" }[q.get("filter")];
  if (f) document.documentElement.style.filter = f;
  if (q.has("clean")) return;
  const bar = document.querySelector(".mockup-bar");
  const link = (k, v, label) => { const u = new URLSearchParams(q); u.set(k, v);
    return `<a href="?${u}" aria-current="${(k === "state" ? state : dir) === v}">${label}</a>`; };
  let html = STATES.length > 1 ? STATES.map(s => link("state", s, s)).join("") : "";
  if (DIRECTIONS.length) {
    html += DIRECTIONS.map(([d]) => link("direction", d, d.toUpperCase())).join("");
    const cur = DIRECTIONS.find(([d]) => d === dir);
    if (cur) html += `<span class="caption">${cur[1]}</span>`;
  }
  if (html) { bar.innerHTML = html; bar.hidden = false; }
})();
</script>
</body>
</html>
